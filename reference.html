<!DOCTYPE HTML>
<html>
<head>
    <title>Reference Letter | Jason Gov</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .ref-page {
            min-height: 100vh;
            padding: 4rem 2rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            z-index: 3;
        }

        .ref-container {
            width: 100%;
            max-width: 1100px;
            background: rgba(27, 31, 34, 0.9);
            border: solid 1px rgba(255, 255, 255, 0.125);
            padding: 2.5rem;
        }

        .ref-container h1 {
            margin-bottom: 1rem;
        }

        .ref-container p {
            text-transform: none;
            letter-spacing: 0.03rem;
            line-height: 1.8;
        }

        .ref-frame {
            width: 100%;
            margin: 2rem 0;
        }

        .ref-frame iframe {
            width: 100%;
            height: 800px;
            border: 0;
            display: block;
            background: #fff;
        }

        .button-row {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        @media screen and (max-width: 736px) {
            .ref-page {
                padding: 2rem 1rem;
            }

            .ref-container {
                padding: 1.5rem;
            }

            .ref-frame iframe {
                height: 500px;
            }
        }
    </style>
</head>
<body>

    <div id="bg"></div>

    <div class="ref-page">
        <div class="ref-container">
            <h1>Reference Letter</h1>
            <p>
                This reference letter reflects my volunteer work at Peter Lougheed Centre.
            </p>

            <div class="ref-frame">
                <iframe src="files/Jason Gov Ref Letter April 2026.pdf" title="Reference Letter"></iframe>
            </div>

            <div class="button-row">
                <a href="index.html#Volunteer" class="button">Back to Volunteer</a>
                <a href="files/Jason Gov Ref Letter April 2026.pdf" target="_blank" rel="noopener noreferrer" class="button primary">Open PDF</a>
            </div>
        </div>
    </div>

</body>
</html>
